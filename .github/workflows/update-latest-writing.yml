name: Update latest writing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/update_latest_writing.py
      - README.md
      - .github/workflows/update-latest-writing.yml
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh latest writing
        run: python scripts/update_latest_writing.py

      - name: Commit changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh latest writing"
          git push
